plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = mod_group
version = mod_version
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        // The simulation core is compiled separately (so it can never depend on Minecraft)
        // but is loaded as part of this mod at runtime.
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Ship the simulation core inside the mod jar.
jar {
    from(project(':core').sourceSets.main.output)
}

processResources {
    var replaceProperties = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            minecraft_version: minecraft_version,
            neoforge_version : neoforge_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
