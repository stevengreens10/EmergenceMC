plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = mod_group
version = mod_version
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

// ---------------------------------------------------------------------------------------------
// The scientific simulation core is a separate source set with NO Minecraft on its classpath,
// so it cannot depend on the game, and it is tested by plain JUnit without launching Minecraft.
// ---------------------------------------------------------------------------------------------
sourceSets {
    core {
        java.srcDirs = ['core/src/main/java']
        resources.srcDirs = ['core/src/main/resources']
    }
    coreTest {
        java.srcDirs = ['core/src/test/java']
        resources.srcDirs = ['core/src/test/resources']
        compileClasspath += sourceSets.core.output
        runtimeClasspath += sourceSets.core.output
    }
    main {
        compileClasspath += sourceSets.core.output
        runtimeClasspath += sourceSets.core.output
    }
}

dependencies {
    coreTestImplementation platform("org.junit:junit-bom:${junit_version}")
    coreTestImplementation 'org.junit.jupiter:junit-jupiter'
    coreTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('coreTest', Test) {
    description = 'Runs the scientific validation suite of the simulation core (no Minecraft).'
    group = 'verification'
    testClassesDirs = sourceSets.coreTest.output.classesDirs
    classpath = sourceSets.coreTest.runtimeClasspath
    useJUnitPlatform()
    // methods run in parallel (see core/src/test/resources/junit-platform.properties)
    maxHeapSize = '6G'
    systemProperty 'emergence.debugSolver', System.getProperty('emergence.debugSolver', 'false')
    systemProperty 'emergence.multirate', System.getProperty('emergence.multirate', 'true')
    if (System.getProperty('emergence.method')) systemProperty 'emergence.method', System.getProperty('emergence.method')
    ['emergence.parallelLoad', 'emergence.parallelMin', 'emergence.parallelWays', 'emergence.multirateEm', 'emergence.debugMultirate', 'emergence.kinks', 'emergence.independent', 'diag.parts'].each { k ->
        if (System.getProperty(k)) systemProperty k, System.getProperty(k)
    }
    // diagnostic knobs for exploratory tests: -Ddiag.<name>=<value> reaches the test JVM
    System.properties.each { k, v -> if (k.toString().startsWith('diag.')) systemProperty k.toString(), v }
    // profiling: -Demergence.jfr=<file.jfr> records a Java Flight Recording of the test run
    if (System.getProperty('emergence.jfr')) jvmArgs "-XX:StartFlightRecording=filename=${System.getProperty('emergence.jfr')},settings=profile"
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
tasks.named('check') { dependsOn 'coreTest' }

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
        }
        // Boots straight into the generated demo world (run ./gradlew generateDemoWorld first).
        demoClient {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'Emergence Demo', '--width', '1280', '--height', '720')
        }
        // Automated visual check: tours the demo world, saves run/screenshots/showcase-*.png, quits.
        showcaseClient {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'Emergence Showcase', '--width', '1280', '--height', '720')
            systemProperty 'emergence.autoShowcase', 'true'
            // motion diagnostics: -Demergence.poseLog=true -Demergence.showcaseOnly=servo,jack (see PoseLog)
            systemProperty 'emergence.poseLog', System.getProperty('emergence.poseLog', 'false')
            systemProperty 'emergence.showcaseOnly', System.getProperty('emergence.showcaseOnly', '')
            // GIF frames for the README: -Demergence.gifs=a,b (with showcaseOnly=a,b), then python tools/make_gifs.py
            systemProperty 'emergence.gifs', System.getProperty('emergence.gifs', '')
            if (System.getProperty('emergence.gifEvery')) systemProperty 'emergence.gifEvery', System.getProperty('emergence.gifEvery')
            // the server's threading, for diagnosis: -Demergence.simThreads=1 (islands in turn), -Demergence.compileWaitMs=-1 (compile on the server thread)
            if (System.getProperty('emergence.simThreads')) systemProperty 'emergence.simThreads', System.getProperty('emergence.simThreads')
            if (System.getProperty('emergence.compileWaitMs')) systemProperty 'emergence.compileWaitMs', System.getProperty('emergence.compileWaitMs')
            System.properties.each { k, v -> if (k.toString().startsWith('diag.')) systemProperty k.toString(), v }
            if (System.getProperty('emergence.dumpIslands')) systemProperty 'emergence.dumpIslands', System.getProperty('emergence.dumpIslands')
            // the part editor's look: -Demergence.editorShots=all (or BATTERY,TANK,…) saves screenshots/editor-*.png
            systemProperty 'emergence.editorShots', System.getProperty('emergence.editorShots', '')
            systemProperty 'emergence.dumpFailures', System.getProperty('emergence.dumpFailures', 'true')
            systemProperty 'emergence.debugIslands', System.getProperty('emergence.debugIslands', 'false')
        }
        // Watch the demo gallery being built: a fresh flat world, the exhibits going up part by part as the camera
        // flies from plot to plot (-Demergence.buildSeconds=N: about N seconds an exhibit, 10 by default).
        watchDemoBuild {
            client()
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'emergence.watchBuild', 'true'
            systemProperty 'emergence.buildSeconds', System.getProperty('emergence.buildSeconds', '10')
            // a check run: screenshots of each exhibit half built and built, and closing once done
            systemProperty 'emergence.watchShots', System.getProperty('emergence.watchShots', 'false')
            systemProperty 'emergence.watchQuit', System.getProperty('emergence.watchQuit', 'false')
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'emergence.debugIslands', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // the tests check behaviour within tick counts, not throughput: no slow motion when they all run at once
            systemProperty 'emergence.globalBudgetMs', '1e9'
            systemProperty 'emergence.islandBudgetMs', '1e9'
            // -Demergence.compileWaitMs=0: every compile left pending (the off-thread path, as a slow machine takes it)
            if (System.getProperty('emergence.compileWaitMs')) systemProperty 'emergence.compileWaitMs', System.getProperty('emergence.compileWaitMs')
        }
        // Generates the showcase world: a game-test server (no EULA prompt, creative flat world) that
        // builds the exhibit gallery at spawn on start-up, runs the in-world tests and saves.
        demoWorld {
            type = 'gameTestServer'
            gameDirectory = project.file('run-demo')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // the tests share the server with the whole gallery: no slow motion, whatever the tick costs
            systemProperty 'emergence.globalBudgetMs', '1e9'
            systemProperty 'emergence.islandBudgetMs', '1e9'
            systemProperty 'emergence.buildDemo', 'true'
        }
        // The power station's own world (./gradlew generateStationWorld): the same build, the station alone.
        stationWorld {
            type = 'gameTestServer'
            gameDirectory = project.file('run-station')
            // (the in-world tests run with the gallery's build; beside the station's big island they were starved)
            systemProperty 'neoforge.enabledGameTestNamespaces', 'emergence_station'
            systemProperty 'emergence.globalBudgetMs', '1e9'
            systemProperty 'emergence.islandBudgetMs', '1e9'
            systemProperty 'emergence.buildDemo', 'true'
            systemProperty 'emergence.demoSet', 'station'
            systemProperty 'emergence.dumpFailures', System.getProperty('emergence.dumpFailures', 'false')
        }
        // The station's tour: plays a copy of its world, checks it as a player finds it, quits.
        stationShowcase {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'Emergence Station Tour', '--width', '1280', '--height', '720')
            systemProperty 'emergence.autoShowcase', 'true'
            systemProperty 'emergence.demoSet', 'station'
            systemProperty 'emergence.showcaseOnly', ''
            systemProperty 'emergence.gifs', System.getProperty('emergence.gifs', '')
            systemProperty 'emergence.dumpFailures', System.getProperty('emergence.dumpFailures', 'true')
            // the station is its world's only island: the whole tick budget is its own (not one island's share of many)
            systemProperty 'emergence.islandBudgetMs', '35'
        }
        // Boots straight into the power station's world (run ./gradlew generateStationWorld first).
        stationClient {
            client()
            programArguments.addAll('--quickPlaySingleplayer', 'Emergence Station', '--width', '1280', '--height', '720')
            systemProperty 'emergence.demoSet', 'station'
            systemProperty 'emergence.dumpFailures', System.getProperty('emergence.dumpFailures', 'false')
            systemProperty 'emergence.islandBudgetMs', '35'
        }
        // A headless server on a copy of the station's world (./gradlew runStationServer): it loads the station as saved,
        // its chunks kept loaded, and writes a dump if the island will not restart (stop it when done).
        stationServer {
            server()
            gameDirectory = project.file('run-station-load')
            programArgument '--nogui'
            systemProperty 'emergence.demoSet', 'station'
            systemProperty 'emergence.dumpFailures', 'true'
            systemProperty 'emergence.forceLoad', '-2,-2,5,3'
            // -Demergence.islandBudgetMs / globalBudgetMs as for the clients (1e9 runs it flat out, as the GameTest does);
            // -Demergence.jfr=<file.jfr> records a Java Flight Recording of the server
            systemProperty 'emergence.islandBudgetMs', System.getProperty('emergence.islandBudgetMs', '12')
            systemProperty 'emergence.globalBudgetMs', System.getProperty('emergence.globalBudgetMs', '35')
            systemProperty 'emergence.debugIslands', System.getProperty('emergence.debugIslands', 'false')
            if (System.getProperty('emergence.jfr')) jvmArguments.add("-XX:StartFlightRecording=filename=${System.getProperty('emergence.jfr')},settings=profile")
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.core
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Ship the simulation core inside the mod jar.
jar {
    from(sourceSets.core.output)
}

processResources {
    var replaceProperties = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            minecraft_version: minecraft_version,
            neoforge_version : neoforge_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('runDemoWorld') {
    doFirst { delete 'run-demo/world' }
}

tasks.named('runStationShowcase') {
    doFirst {
        delete 'run/saves/Emergence Station Tour'
        copy {
            from 'run-station/world'
            into 'run/saves/Emergence Station Tour'
        }
    }
}

tasks.named('runStationWorld') {
    doFirst { delete 'run-station/world' }
}

tasks.named('runStationServer') {
    doFirst {
        delete 'run-station-load/world'
        copy { from 'run-station/world'; into 'run-station-load/world' }
        file('run-station-load').mkdirs()
        file('run-station-load/eula.txt').text = 'eula=true\n'
        file('run-station-load/server.properties').text = 'online-mode=false\nlevel-name=world\nspawn-protection=0\n'
    }
}

// ./gradlew generateStationWorld  ->  run/saves/Emergence Station (open it from Singleplayer, or ./gradlew runStationClient)
tasks.register('generateStationWorld', Copy) {
    group = 'emergence'
    description = 'Builds the power station world and installs it into run/saves.'
    dependsOn 'runStationWorld'
    from 'run-station/world'
    into 'run/saves/Emergence Station'
    doFirst { delete 'run/saves/Emergence Station' }
}

// ./gradlew generateDemoWorld  ->  run/saves/Emergence Demo (open it from Singleplayer)
tasks.register('generateDemoWorld', Copy) {
    group = 'emergence'
    description = 'Builds the demo world with all exhibits and installs it into run/saves.'
    dependsOn 'runDemoWorld'
    from 'run-demo/world'
    into 'run/saves/Emergence Demo'
    doFirst { delete 'run/saves/Emergence Demo' }
}

// A fresh world each time: the watched build makes it itself, from the title screen.
tasks.named('runWatchDemoBuild') {
    doFirst { delete 'run/saves/Emergence Build' }
}

// The tour flips switches and cranks machines; it plays a throwaway copy so the installed demo world stays pristine.
tasks.named('runShowcaseClient') {
    doFirst {
        delete 'run/saves/Emergence Showcase'
        copy {
            from 'run-demo/world'
            into 'run/saves/Emergence Showcase'
        }
    }
}
